services:
  api-core:
    image: ${API_CORE_IMAGE:-40labs/api-core:local}
    build:
      context: ../..
      dockerfile: infra/docker/api-core.Dockerfile
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      NEXTSMS_API_TOKEN_FILE: /run/secrets/nextsms_api_token
      ACTIVATION_SIGNING_KEY_FILE: /run/secrets/activation_signing_key
      DEVICE_TOKEN_SIGNING_KEY_ID: v1
      DEVICE_TOKEN_SIGNING_KEYS_FILE: /run/secrets/device_token_signing_keys
      TOTP_ENC_KEY_FILE: /run/secrets/admin_totp_enc_key
      ADMIN_WEB_ORIGIN: ${ADMIN_WEB_ORIGIN:?Set ADMIN_WEB_ORIGIN to the public HTTPS Admin Web origin}
      SMS_MODE: live
      APP_ENV: ${APP_ENV:-production}
      DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-40}
      DATABASE_CONNECT_TIMEOUT_SECS: ${DATABASE_CONNECT_TIMEOUT_SECS:-5}
      DATABASE_ACQUIRE_TIMEOUT_SECS: ${DATABASE_ACQUIRE_TIMEOUT_SECS:-5}
      PORT: 3000
      ADMIN_DEBUG_OTP: "0"
    secrets:
      - database_url
      - nextsms_api_token
      - activation_signing_key
      - device_token_signing_keys
      - admin_totp_enc_key
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:size=64M,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "65532:65532"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: always
    stop_grace_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api-core-migrate:
    image: ${API_CORE_IMAGE:-40labs/api-core:local}
    entrypoint: ["/app/api-core", "migrate"]
    profiles: ["migrate"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL_FILE: /run/secrets/database_url
      MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_database_url
      DATABASE_CONNECT_TIMEOUT_SECS: ${DATABASE_CONNECT_TIMEOUT_SECS:-5}
      DATABASE_ACQUIRE_TIMEOUT_SECS: ${DATABASE_ACQUIRE_TIMEOUT_SECS:-5}
    secrets:
      - database_url
      - migration_database_url
    read_only: true
    tmpfs:
      - /tmp:size=64M,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "65532:65532"

secrets:
  database_url:
    file: ./secrets/database_url.txt
  migration_database_url:
    file: ./secrets/migration_database_url.txt
  nextsms_api_token:
    file: ./secrets/nextsms_api_token.txt
  activation_signing_key:
    file: ./secrets/activation_signing_key.txt
  device_token_signing_keys:
    file: ./secrets/device_token_signing_keys.txt
  admin_totp_enc_key:
    file: ./secrets/admin_totp_enc_key.txt
