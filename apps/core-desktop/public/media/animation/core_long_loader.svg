<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 60 415 435" role="img" aria-label="Loading" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .h{transform-box:fill-box;transform-origin:center;opacity:.15;animation:seq 1.6s ease-in-out infinite}
