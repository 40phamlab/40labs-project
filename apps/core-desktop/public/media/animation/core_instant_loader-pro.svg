<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 30 475 485" role="img" aria-label="Loading" shape-rendering="geometricPrecision" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .h{
      transform-box:fill-box;transform-origin:center;
      opacity:0;
      animation:assemble 2.8s infinite;
    }
    .t{--x:0px;--y:-38px;animation-delay:0s}
    .l{--x:-34px;--y:-8px;animation-delay:.12s}
    .r{--x:34px;--y:-8px;animation-delay:.24s}
    .b{--x:0px;--y:38px;animation-delay:.36s}
    @keyframes assemble{
      0%   {opacity:0;transform:translate(var(--x),var(--y)) scale(.82);animation-timing-function:cubic-bezier(.22,1,.36,1)}
      28%  {opacity:1;transform:translate(0,0) scale(1)}
      74%  {opacity:1;transform:translate(0,0) scale(1);animation-timing-function:cubic-bezier(.55,0,.8,.4)}
      92%  {opacity:0;transform:translate(calc(var(--x)*-.35),calc(var(--y)*-.35)) scale(.94)}
      100% {opacity:0;transform:translate(var(--x),var(--y)) scale(.82)}
    }
    .pulse{
      transform-box:fill-box;transform-origin:center;
      animation:pulse 2.8s infinite;
    }
    @keyframes pulse{
      0%,38%{transform:scale(1);filter:none}
      50%{transform:scale(1.07);filter:drop-shadow(0 0 14px rgba(247,148,29,.75))}
      62%,100%{transform:scale(1);filter:none}
    }
    .ring{
      fill:none;stroke:#FFFFFF;stroke-width:3;stroke-linecap:round;
      stroke-dasharray:90 1710;opacity:.0;
      animation:orbit 2.8s linear infinite;
    }
    @keyframes orbit{
      0%,30%{stroke-dashoffset:0;opacity:0}
      36%{opacity:.9}
      70%{opacity:.9}
      76%,100%{stroke-dashoffset:-1800;opacity:0}
    }
    @media (prefers-reduced-motion:reduce){
      .h,.pulse,.ring{animation:none}
      .h{opacity:1}
      .ring{display:none}
    }
  </style>

  <!-- subtle orbiting highlight around the whole mark -->
  <circle class="ring" cx="277" cy="277" r="228" pathLength="1800" transform="rotate(-90 277 277)"/>

  <g stroke="#FFFFFF" stroke-width="10" stroke-linejoin="miter">
    <polygon class="h t" fill="#006837" points="280,82 365,130 365,175 280,222 195,175 195,130"/>
    <polygon class="h l" fill="#006837" points="177,190 265,240 265,262 170,315 170,380 92,335 92,232"/>
    <g class="pulse">
      <polygon class="h r" fill="#F7941D" points="380,190 462,238 462,335 382,380 382,318 293,265 293,236"/>
    </g>
    <polygon class="h b" fill="#006837" points="277,284 366,334 366,420 277,470 190,420 190,334"/>
  </g>
</svg>
