<!doctype html>
<html lang="sw">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/media/logo/core-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>40LabsCore</title>
    <script>
      (function () {
        var saved = localStorage.getItem('40labs_theme');
        var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
        var bg = theme === 'light' ? '#F8FAFB' : '#1A1A1A';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.backgroundColor = bg;
        document.documentElement.style.colorScheme = theme;
      })();
      window.onerror = function (msg, url, line, col, error) {
        console.error("Error: " + msg + "\nurl: " + url + "\nline: " + line, error);
      };
      window.addEventListener("unhandledrejection", function (event) {
        console.error("Unhandled Rejection: ", event.reason);
      });
    </script>
  </head>

  <body>
    <div id="root">
      <div
        style="
          display: flex;
          height: 100vh;
          width: 100vw;
          align-items: center;
          justify-content: center;
        "
      >
        <img src="/media/animation/core_instant_loader.svg" width="96" alt="Loading 40Labs" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
